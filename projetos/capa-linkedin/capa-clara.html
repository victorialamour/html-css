<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><title>Capa LinkedIn — capa-clara — Victória L'Amour</title>
<link rel="stylesheet" href="fontes.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
.cv{position:relative;width:1584px;height:396px;overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cv .art{position:absolute;inset:0;display:block}
.tx{position:absolute;left:464px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center}
.mark{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.3em;margin-bottom:24px}
.mark span{opacity:.42;margin:0 4px}
h1{font:500 45px/1.14 'Inter Tight',Inter,sans-serif;letter-spacing:-.025em;margin-bottom:26px}
h1 em{font:400 50px/1 'Instrument Serif',Georgia,serif;font-style:italic;letter-spacing:-.01em;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.disc{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.2em}
.clara{background:#F5EEE9;color:#220F13}
.clara .mark,.clara .disc{color:#7C6960}
.clara h1 em{background-image:linear-gradient(94deg,#DD5F22 0%,#C42F3C 68%,#8E1D3A 100%)}
.clara .disc span{color:#D4482A;margin:0 3px}
.clara .mark span{color:#7C6960}
.escura{background:#2B0E18;color:#F9F1EB}
.escura .mark,.escura .disc{color:#C3A49C}
.escura h1 em{background-image:linear-gradient(94deg,#F5B44E 0%,#EC7A38 52%,#D6404A 100%)}
.escura .disc span{color:#F0913F;margin:0 3px}
body{display:grid;place-items:center;min-height:100vh;background:#E4DDD6}</style></head>
<body><div class="cv clara"><svg class="art" viewBox="0 0 1584 396" width="1584" height="396" aria-hidden="true">
