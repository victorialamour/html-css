<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Capa LinkedIn — Diagonal — Victória L'Amour</title>
<link rel="stylesheet" href="fontes.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.cv{position:relative;width:1584px;height:396px;overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cv .art{display:block}
body{display:grid;place-items:center;min-height:100vh;background:#E9E6E1}

.cv1{background:#FCFAF7;color:#141210}
.cv1 .art{position:absolute;inset:0}
.cv1-txt{position:absolute;left:464px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center}
.cv1-mark{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.3em;color:#6E6862;margin-bottom:24px}
.cv1-mark span{opacity:.45;margin:0 4px}
.cv1-head{font:500 45px/1.14 'Inter Tight',Inter,sans-serif;letter-spacing:-0.025em;margin-bottom:26px}
.cv1-head em{font:400 50px/1 'Instrument Serif',Georgia,serif;font-style:italic;letter-spacing:-0.01em;
  background:linear-gradient(94deg,#E0552C 0%,#D8407B 78%,#B14BAE 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cv1-disc{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.2em;color:#6E6862}
.cv1-disc span{color:#D8552F;margin:0 3px}

</style>
</head>
<body>

<div class="cv cv1" role="img" aria-label="Capa de LinkedIn de Victória L'Amour — consultoria comercial, liderança e Customer Experience">
  
  <svg class="art" viewBox="0 0 1584 396" width="1584" height="396" aria-hidden="true">
    
    <defs>
      <linearGradient id="dc" gradientUnits="userSpaceOnUse" x1="1040" y1="396" x2="1370" y2="0"><stop offset="0.0%" stop-color="#FFC98A"/><stop offset="16.7%" stop-color="#FF9C86"/><stop offset="33.3%" stop-color="#F58BB2"/><stop offset="50.0%" stop-color="#CE96E4"/><stop offset="66.7%" stop-color="#9BAFEE"/><stop offset="83.3%" stop-color="#9FD6DE"/><stop offset="100.0%" stop-color="#EFEBE2"/></linearGradient>
      <linearGradient id="dm" gradientUnits="userSpaceOnUse"
        x1="1205.0" y1="198" x2="1546.9" y2="482.9">
        <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="14%" stop-color="#fff" stop-opacity="0.86"/>
        <stop offset="38%" stop-color="#fff" stop-opacity="0.46"/>
        <stop offset="68%" stop-color="#fff" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="dv" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
        <stop offset="30%" stop-color="#fff" stop-opacity="0.5"/>
        <stop offset="62%" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="dM"><rect width="1584" height="396" fill="url(#dm)"/></mask>
      <mask id="dV"><rect width="1584" height="396" fill="url(#dv)"/></mask>
      <clipPath id="dP"><polygon points="1040,396 1370,0 1584,0 1584,396"/></clipPath>
    </defs>
    <g clip-path="url(#dP)"><g mask="url(#dM)"><g mask="url(#dV)">
      <rect width="1584" height="396" fill="url(#dc)"/>
    </g></g></g>
    
  <defs><filter id="dg">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter></defs>
  <rect width="1584" height="396" filter="url(#dg)" opacity="0.05" style="mix-blend-mode:multiply"/>
  </svg>
  <div class="cv1-txt">
    <p class="cv1-mark">VICTÓRIA L'AMOUR <span>·</span> RECIFE / PE</p>
    <h1 class="cv1-head">Times comerciais mais fortes,<br>clientes que <em>permanecem</em>.</h1>
    <p class="cv1-disc">DIAGNÓSTICO COMERCIAL <span>·</span> TREINAMENTO <span>·</span> LIDERANÇA DE EQUIPES <span>·</span> CUSTOMER EXPERIENCE</p>
  </div>
</div>
</body>
</html>
