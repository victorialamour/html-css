<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Capa LinkedIn — Espectro — Victória L'Amour</title>
<link rel="stylesheet" href="fontes.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.cv{position:relative;width:1584px;height:396px;overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cv .art{display:block}
body{display:grid;place-items:center;min-height:100vh;background:#E9E6E1}

.cv2{background:#0B0A12;color:#F5F2EE}
.cv2 .art{position:absolute;inset:0}
.cv2-txt{position:absolute;left:464px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center}
.cv2-mark{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.3em;color:#9A93A8;margin-bottom:24px}
.cv2-mark span{opacity:.45;margin:0 4px}
.cv2-head{font:500 45px/1.14 'Inter Tight',Inter,sans-serif;letter-spacing:-0.025em}
.cv2-head em{font:400 50px/1 'Instrument Serif',Georgia,serif;font-style:italic;letter-spacing:-0.01em;
  background:linear-gradient(96deg,#FF9A5B 0%,#FF6E9C 45%,#A88BFF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cv2-disc{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.2em;color:#CFC8DC;margin-top:26px}
.cv2-disc span{color:#FF7A3D;margin:0 3px}

</style>
</head>
<body>

<div class="cv cv2" role="img" aria-label="Capa de LinkedIn de Victória L'Amour — consultoria comercial, liderança e Customer Experience">
  
  <svg class="art" viewBox="0 0 1584 396" width="1584" height="396" aria-hidden="true">
    <defs>
      <radialGradient id="eHalo" cx="70%" cy="46%" r="52%">
        <stop offset="0%" stop-color="#2A1F5E" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#2A1F5E" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1584" height="396" fill="url(#eHalo)"/>
    <g style="mix-blend-mode:screen">
      
    <defs>
      <linearGradient id="ec" gradientUnits="userSpaceOnUse" x1="1078" y1="396" x2="1408" y2="0"><stop offset="0.0%" stop-color="#FF7A3D"/><stop offset="20.0%" stop-color="#FF4E7A"/><stop offset="40.0%" stop-color="#C548D8"/><stop offset="60.0%" stop-color="#6B5BFF"/><stop offset="80.0%" stop-color="#3CA8E8"/><stop offset="100.0%" stop-color="#39D6B0"/></linearGradient>
      <linearGradient id="em" gradientUnits="userSpaceOnUse"
        x1="1243.0" y1="198" x2="1592.5" y2="489.3">
        <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="14%" stop-color="#fff" stop-opacity="0.86"/>
        <stop offset="38%" stop-color="#fff" stop-opacity="0.46"/>
        <stop offset="68%" stop-color="#fff" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="ev" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
        <stop offset="30%" stop-color="#fff" stop-opacity="0.5"/>
        <stop offset="62%" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="eM"><rect width="1584" height="396" fill="url(#em)"/></mask>
      <mask id="eV"><rect width="1584" height="396" fill="url(#ev)"/></mask>
      <clipPath id="eP"><polygon points="1078,396 1408,0 1584,0 1584,396"/></clipPath>
    </defs>
    <g clip-path="url(#eP)"><g mask="url(#eM)"><g mask="url(#eV)">
      <rect width="1584" height="396" fill="url(#ec)"/>
    </g></g></g>
    </g>
    
  <defs><filter id="eg">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter></defs>
  <rect width="1584" height="396" filter="url(#eg)" opacity="0.09" style="mix-blend-mode:multiply"/>
  </svg>
  <div class="cv2-txt">
    <p class="cv2-mark">VICTÓRIA L'AMOUR <span>·</span> RECIFE / PE</p>
    <h1 class="cv2-head">Times comerciais mais fortes,<br>clientes que <em>permanecem</em>.</h1>
    <p class="cv2-disc">DIAGNÓSTICO COMERCIAL <span>·</span> TREINAMENTO <span>·</span> LIDERANÇA DE EQUIPES <span>·</span> CUSTOMER EXPERIENCE</p>
  </div>
</div>
</body>
</html>
