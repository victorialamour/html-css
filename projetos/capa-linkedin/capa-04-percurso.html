<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Capa LinkedIn — Percurso — Victória L'Amour</title>
<link rel="stylesheet" href="fontes.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.cv{position:relative;width:1584px;height:396px;overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cv .art{display:block}
body{display:grid;place-items:center;min-height:100vh;background:#E9E6E1}

.cv4{background:#150F2B;color:#F6F1EC}
.cv4 .art{position:absolute;inset:0}
.cv4-txt{position:absolute;left:464px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center;padding-bottom:64px}
.cv4-mark{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.3em;color:#B6A9CE;margin-bottom:22px}
.cv4-mark span{opacity:.45;margin:0 4px}
.cv4-head{font:500 45px/1.14 'Inter Tight',Inter,sans-serif;letter-spacing:-0.025em;margin-bottom:22px}
.cv4-head em{font:400 50px/1 'Instrument Serif',Georgia,serif;font-style:italic;letter-spacing:-0.01em;
  background:linear-gradient(94deg,#FFB07A 0%,#FF87A6 60%,#C9A6FF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cv4-disc{font:500 11.5px/1 Inter,sans-serif;letter-spacing:.2em;color:#C3B7D8}
.cv4-disc span{color:#FF9A7A;margin:0 3px}

</style>
</head>
<body>

<div class="cv cv4" role="img" aria-label="Capa de LinkedIn de Victória L'Amour — da primeira conversa à recompra">
