<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><title>slide-1 — Victória L'Amour</title>
<link rel="stylesheet" href="fontes.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
.sl{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.sl .art{position:absolute;inset:0;display:block}
.tx{position:absolute;inset:0;padding:104px 96px 150px;display:flex;flex-direction:column}
.tx.mid{justify-content:center;padding-top:96px}
.eye{font:500 20px/1 Inter,sans-serif;letter-spacing:.26em;margin-bottom:52px}
h1{font:500 66px/1.12 'Inter Tight',Inter,sans-serif;letter-spacing:-.032em}
h1 em{font:400 72px/1.12 'Instrument Serif',Georgia,serif;font-style:italic;letter-spacing:-.012em;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:400 27px/1.55 Inter,sans-serif;letter-spacing:-.005em;margin-top:40px;max-width:640px}
.list{list-style:none;margin-top:56px;display:flex;flex-direction:column;gap:26px;max-width:660px}
.list li{font:400 27px/1.45 Inter,sans-serif;letter-spacing:-.005em;padding-left:52px;position:relative}
.list li::before{content:"";position:absolute;left:0;top:.66em;width:30px;height:2px}
.list.arrow li::after{content:"";position:absolute;left:22px;top:calc(.66em - 4px);width:10px;height:10px;
  border-top:2px solid;border-right:2px solid;transform:rotate(45deg)}
.meta{margin-top:auto;display:flex;flex-direction:column;gap:20px}
.meta .rule{width:110px;height:1px;background:currentColor;opacity:.35}
.meta p{font:500 18px/1.5 Inter,sans-serif;letter-spacing:.2em}
.meta i{font-style:normal;opacity:.45;margin:0 3px}
.cta{font:400 31px/1.5 Inter,sans-serif;letter-spacing:-.01em;max-width:660px;margin-top:30px;padding-bottom:26px}
.ft{position:absolute;left:96px;right:96px;bottom:56px;display:flex;justify-content:space-between;
  font:500 17px/1 Inter,sans-serif;letter-spacing:.2em}
.escura{background:#2B0E18;color:#F9F1EB}
.escura .eye,.escura .ft,.escura .meta p{color:#C3A49C}
.escura h1 em{background-image:linear-gradient(94deg,#F5B44E 0%,#EC7A38 52%,#D6404A 100%)}
.escura .sub,.escura .cta{color:#E4CFC7}
.escura .list li{color:#F9F1EB}
.escura .list li::before{background:#F0913F}
.escura .list.arrow li::after{border-color:#F0913F}
.clara{background:#F5EEE9;color:#220F13}
.clara .eye,.clara .ft{color:#7C6960}
.clara h1 em{background-image:linear-gradient(94deg,#DD5F22 0%,#C42F3C 68%,#8E1D3A 100%)}
.clara .sub{color:#5C4C46}
.clara .list li{color:#2C1A1E}
.clara .list li::before{background:#D4482A}
body{display:grid;place-items:center;min-height:100vh;background:#E4DDD6}</style></head>
<body><div class="sl escura"><svg class="art" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true">
  <defs>
    <radialGradient id="s11" cx="88%" cy="18%" r="58%">
      <stop offset="0%" stop-color="#B4342F" stop-opacity="0.5"/><stop offset="100%" stop-color="#B4342F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s12" cx="14%" cy="86%" r="60%">
      <stop offset="0%" stop-color="#6B1226" stop-opacity="0.75"/><stop offset="100%" stop-color="#6B1226" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#s12)"/>
  <rect width="1080" height="1350" fill="url(#s11)"/><g style="mix-blend-mode:screen">
    <defs>
      <linearGradient id="s1fc" gradientUnits="userSpaceOnUse" x1="560" y1="1350" x2="1080" y2="760"><stop offset="0.0%" stop-color="#F9CB78"/><stop offset="25.0%" stop-color="#F3A344"/><stop offset="50.0%" stop-color="#E86A32"/><stop offset="75.0%" stop-color="#D6403C"/><stop offset="100.0%" stop-color="#A81F3C"/></linearGradient>
      <linearGradient id="s1fm" gradientUnits="userSpaceOnUse" x1="820.0" y1="1055.0"
        x2="1067.6" y2="1273.2">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.82"/>
        <stop offset="15%" stop-color="#fff" stop-opacity="0.7051999999999999"/>
        <stop offset="40%" stop-color="#fff" stop-opacity="0.36079999999999995"/>
        <stop offset="70%" stop-color="#fff" stop-opacity="0.1148"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="s1fM"><rect width="1080" height="1350" fill="url(#s1fm)"/></mask>
      
      <clipPath id="s1fP"><polygon points="560,1350 1080,760 1080,1350"/></clipPath>
    </defs>
    <g clip-path="url(#s1fP)"><g mask="url(#s1fM)">
      <rect width="1080" height="1350" fill="url(#s1fc)"/>
    </g></g></g>
  <defs><filter id="s1g"><feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/></filter></defs>
  <rect width="1080" height="1350" filter="url(#s1g)" opacity="0.09" style="mix-blend-mode:multiply"/></svg><div class="tx"><p class="eye">DIAGNÓSTICO COMERCIAL</p>
      <h1>Você treinou<br>o time inteiro.<br><em>E a venda continua<br>parando no mesmo lugar.</em></h1>
      <p class="sub">Treinamento não resolve o que ninguém mediu.</p></div>
  <footer class="ft"><span>VICTÓRIA L'AMOUR</span><span>01 / 04</span></footer></div></body></html>
