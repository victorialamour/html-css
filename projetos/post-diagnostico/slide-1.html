<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><title>slide-1 — Victória L'Amour</title>
<link rel="stylesheet" href="fontes.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
.sl{position:relative;width:1080px;height:1350px;overflow:hidden;
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.sl .art{position:absolute;inset:0;display:block}
.tx{position:absolute;inset:0;padding:104px 96px 150px;display:flex;flex-direction:column}
.tx.mid{justify-content:center;padding-top:96px}
.eye{font:500 20px/1 Inter,sans-serif;letter-spacing:.26em;margin-bottom:52px}
h1{font:500 66px/1.12 'Inter Tight',Inter,sans-serif;letter-spacing:-.032em}
h1 em{font:400 72px/1.12 'Instrument Serif',Georgia,serif;font-style:italic;letter-spacing:-.012em}
.sub{font:400 27px/1.55 Inter,sans-serif;letter-spacing:-.005em;margin-top:40px;max-width:640px}
.list{list-style:none;margin-top:56px;display:flex;flex-direction:column;gap:26px;max-width:640px}
.list li{font:400 27px/1.45 Inter,sans-serif;letter-spacing:-.005em;padding-left:52px;position:relative}
.list li::before{content:"";position:absolute;left:0;top:.66em;width:30px;height:2px}
.list.arrow li::before{width:30px;height:2px}
.list.arrow li::after{content:"";position:absolute;left:22px;top:calc(.66em - 4px);width:10px;height:10px;
  border-top:2px solid;border-right:2px solid;transform:rotate(45deg)}
.cta{font:400 31px/1.5 Inter,sans-serif;letter-spacing:-.01em;max-width:660px;margin-top:30px;padding-bottom:26px}
.meta{margin-top:auto;display:flex;flex-direction:column;gap:20px}
.meta .rule{width:110px;height:1px;background:currentColor;opacity:.35}
.meta p{font:500 18px/1.5 Inter,sans-serif;letter-spacing:.2em}
.meta i{font-style:normal;opacity:.45;margin:0 3px}
.ft{position:absolute;left:96px;right:96px;bottom:56px;display:flex;justify-content:space-between;
  font:500 17px/1 Inter,sans-serif;letter-spacing:.2em}
.ft i{font-style:normal;opacity:.4}
.spacer{flex:1}

/* fundo escuro */
.dark{background:#150F2B;color:#F6F1EC}
.dark .eye{color:#C3B7D8}
.dark h1 em{background:linear-gradient(96deg,#FFB07A 0%,#FF87A6 58%,#C9A6FF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.dark .sub,.dark .cta{color:#D6CDE6}
.dark .meta p{color:#B0A3C9}
.dark .list li{color:#EDE7F5}
.dark .list li::before{background:#FF9A7A}
.dark .list.arrow li::after{border-color:#FF9A7A}
.dark .ft{color:#9C8FB8}

/* marfim */
.ivory{background:#FCFAF7;color:#141210}
.ivory .eye{color:#8B7F76}
.ivory h1 em{background:linear-gradient(96deg,#E0552C 0%,#D8407B 74%,#B14BAE 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ivory .sub{color:#4E434B}
.ivory .list li{color:#2A2429}
.ivory .list li::before{background:#D8552F}
.ivory .ft{color:#8B7F76}

/* lilás-neblina */
.mist{background:#EBE7EE;color:#171320}
.mist .eye{color:#6B6478}
.mist h1 em{background:linear-gradient(96deg,#DD5230 0%,#C63C86 62%,#6E4FD1 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.mist .sub{color:#5A5368}
.mist .list li{color:#241F30}
.mist .list li::before{background:#C63C86}
.mist .ft{color:#6B6478}

body{display:grid;place-items:center;min-height:100vh;background:#E9E6E1}</style></head>
<body><div class="sl dark" id="slide-1"><svg class="art" viewBox="0 0 1080 1350" width="1080" height="1350" aria-hidden="true">
  <defs>
    <radialGradient id="s1a" cx="86%" cy="10%" r="52%">

    </radialGradient>

    <g filter="url(#s1gm)" opacity="0.9"><path d="M -60 1180 C 300 1150 680 1105 1150 880" fill="none" stroke="url(#s1L)" stroke-width="10"/></g>
    <path d="M -60 1180 C 300 1150 680 1105 1150 880" fill="none" stroke="url(#s1L)" stroke-width="3"/>

      <circle cx="774.8" cy="1030.3" r="39.2" fill="#FF7A9C" opacity="0.13"/>
      <circle cx="774.8" cy="1030.3" r="9.8" fill="#FFF3F0"/>
      <circle cx="1011.6" cy="942.3" r="48.8" fill="#FF7A9C" opacity="0.16"/>
      <circle cx="1011.6" cy="942.3" r="12.2" fill="#FFF3F0"/>
      <circle cx="1011.6" cy="942.3" r="26.2" fill="none" stroke="#FFC9B0" stroke-width="2" opacity="0.85"/>
  <defs><filter id="s1n"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/></filter></defs>
  <rect width="1080" height="1350" filter="url(#s1n)" opacity="0.09" style="mix-blend-mode:multiply"/></svg><div class="tx"><p class="eye">DIAGNÓSTICO COMERCIAL</p>
      <h1>Você treinou<br>o time inteiro.<br><em>E a venda continua<br>parando no mesmo lugar.</em></h1>
      <p class="sub">Treinamento não resolve o que ninguém mediu.</p></div><footer class="ft"><span>VICTÓRIA L'AMOUR</span><span class="pg">01 / 04</span></footer></div></body></html>
